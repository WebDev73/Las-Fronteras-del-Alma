<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Fronteras del Alma — Listen Now</title>
<style>
  :root{
    --ink:#1c1b19;
    --sand:#efe7d8;
    --rust:#9c4221;
    --line:#c9bfa8;
    --paper:#f7f2e7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(circle at 20% 15%, rgba(156,66,33,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(28,27,25,0.06), transparent 50%),
      var(--paper);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 18px;
  }
  .card{
    width:100%;
    max-width:420px;
  }
  .mark{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:34px;
  }
  .mark svg{ flex:none; }
  .mark .divider{
    width:1px;
    align-self:stretch;
    background:var(--line);
  }
  h1{
    font-size: 1.55rem;
    line-height:1.25;
    margin:0;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .sub{
    margin:6px 0 0;
    font-size:0.95rem;
    color:#5a5650;
    font-style:italic;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  a.service{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    background:var(--sand);
    border:1px solid var(--line);
    border-radius:2px;
    text-decoration:none;
    color:var(--ink);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.service:active{ transform: scale(0.98); }
  a.service:hover{ background:#e7dcc4; }
  a.service .icon{
    width:34px; height:34px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  a.service .label{
    font-size:1.05rem;
    font-weight:600;
    flex:1;
  }
  a.service .go{
    font-size:0.85rem;
    color:var(--rust);
    font-style:italic;
  }
  footer{
    margin-top:32px;
    text-align:center;
    font-size:0.78rem;
    color:#8a8478;
    font-style:italic;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none">
        <circle cx="23" cy="23" r="22" stroke="#9c4221" stroke-width="1.4"/>
        <path d="M13 30 L23 14 L33 30" stroke="#1c1b19" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
        <line x1="17.5" y1="24" x2="28.5" y2="24" stroke="#1c1b19" stroke-width="1.4"/>
      </svg>
      <div class="divider"></div>
      <div>
        <h1>Las Fronteras del Alma</h1>
        <p class="sub">Choose where to listen</p>
      </div>
    </div>

    <div class="links">
      <a class="service" href="https://open.spotify.com/artist/0VST6FLToR7qdK4wUo1lre?si=ay_Dw_GhQoyIarvlquBmlg&utm_source=copy-link">
        <span class="icon">
          <svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1DB954"/><path d="M6.5 9.5c3.2-1 7.3-.6 9.8.9M6.8 13c2.6-.8 5.9-.5 8 .8M7.2 16.2c2.1-.6 4.6-.4 6.2.6" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        </span>
        <span class="label">Spotify</span>
        <span class="go">Open →</span>
      </a>

      <a class="service" href="https://music.apple.com/us/artist/las-fronteras-del-alma/6810501572">
        <span class="icon">
          <svg width="28" height="28" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#000"/><path d="M14.5 6.2c.9-.05 1.6.35 2.1 1a2.7 2.7 0 0 1-.8 3.9c-.85.55-1.75.4-2.5-.15a2.6 2.6 0 0 1 1.2-4.75zM9 9.8c1.1-.2 2 .1 2.5.9l.02 6.9c0 1.15-.85 1.85-1.85 1.55a1.9 1.9 0 0 1-1.3-1.9c0-.8.5-1.4 1.15-1.7v-4.2c-.9.1-1.6.4-2.2.9v-2c.55-.3 1.1-.4 1.68-.45z" fill="#fff"/></svg>
        </span>
        <span class="label">Apple Music</span>
        <span class="go">Open →</span>
      </a>

      <a class="service" href="https://music.amazon.ca/artists/B0HJCF412Q?ref=dm_sh_5mmrl2uh5wOC8Zx4IuIuv1PAp">
        <span class="icon">
          <svg width="28" height="28" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="4" fill="#25D0D1"/><path d="M6 15.5c3.5 2 8.5 2 12 0" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M18 15.5l.9 2" stroke="#000" stroke-width="1.4" stroke-linecap="round"/><path d="M8 8h8v6.5H8z" fill="none" stroke="#000" stroke-width="1.2"/></svg>
        </span>
        <span class="label">Amazon Music</span>
        <span class="go">Open →</span>
      </a>
    </div>

    <footer>Scan again anytime to come back here</footer>
  </div>
</body>
</html>
