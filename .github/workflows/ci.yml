name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Core and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test :core and :server
        run: ./gradlew :core:test :server:test :server:installDist -Pfronteras.android=false --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: |
            core/build/reports/tests
            server/build/reports/tests

  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships an Android SDK with ANDROID_HOME set; AGP installs missing platforms.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble, unit test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: fronteras-debug-apk
          path: app/build/outputs/apk/debug/*.apk
